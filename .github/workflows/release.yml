name: Release

# Publishes a tag: tests, an sdist and wheel attached to the GitHub release,
# and, when the repository variable PUBLISH_PYPI is "true", a PyPI upload
# through Trusted Publishing. Register this repo, release.yml and environment
# `pypi` as a (pending) trusted publisher on pypi.org first. No token is stored.
# prepare-release.yml dispatches this on the tag; a manual tag push also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a vX.Y.Z tag ref
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag ref"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/version-sync.sh "$GITHUB_REF_NAME"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run -m pytest
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          set -euo pipefail
          name=$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          uv run --isolated --no-project --with dist/*.whl "$name" release
      - run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: rm dist/*.sha256
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: [build, publish-pypi]
    # Runs when publish-pypi succeeded or was skipped (PUBLISH_PYPI unset).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --latest --strip header > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
